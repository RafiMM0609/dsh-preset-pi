# ============================================================================
# dsh-preset-pi: Pi-style Agent Preset for DeepSeek Harness
# ============================================================================
# Provides a lean, fast, Pi-inspired coding preset with:
#   - Short concise persona (replaces bloated default system prompt)
#   - Full coding toolset: bash, fs (read/write), batch multi-edit
#   - Free Web Search & Web Fetch (dsh-free-search & tool-web)
#   - Context history compaction
# ============================================================================

- insert:
    - id: preset-pi-web
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pi-web
        name: Pi (Web Search)
        description: Lean pi-style coding agent with integrated web search & batch editing
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding assistant running inside pi, a coding agent harness.
                Help users inspect files, run commands, modify code, and search the web.
                Use bash for file operations like listing and searching files (ls, rg, find).
                Be concise in your responses.
                Show file paths clearly when working with files.
              complete: true
              includeRuntimeContext: true

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              edit: false

          - id: tool-edit-batch
            name: 'dsh-tool-edit-batch'

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
